<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulador WebXR de Entrevistas - Meta Quest 2</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #ui-container {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      display: flex;
      gap: 12px;
      background: rgba(15, 41, 66, 0.85);
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid rgba(56, 189, 248, 0.4);
    }

    .ui-btn {
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .ui-btn:hover {
      background: #0369a1;
    }

    .ui-btn.secondary {
      background: #334155;
    }
  </style>
</head>
<body>
  <!-- Controles 2D de respaldo para PC -->
  <div id="ui-container">
    <button id="btn-habituacion" class="ui-btn">Probar Microfono e Iniciar</button>
    <button id="btn-finalizar-respuesta" class="ui-btn" style="display: none;">Terminar Respuesta</button>
    <button id="btn-simular-texto" class="ui-btn secondary" style="display: none;">Texto Ejemplo</button>
  </div>

  <a-scene
    webxr="optionalFeatures: local-floor, bounded-floor"
    cursor="rayOrigin: mouse"
    raycaster="objects: .raycastable"
    renderer="antialias: true; colorManagement: true"
  >
    <!-- Iluminación y entorno -->
    <a-sky color="#cbd5e1"></a-sky>
    <a-light type="ambient" color="#ffffff" intensity="0.75"></a-light>
    <a-light type="directional" position="1.5 3 2" intensity="0.85" cast-shadow="true"></a-light>

    <!-- Oficina 3D -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="8" height="8" color="#334155"></a-plane>
    <a-plane position="0 3.2 0" rotation="90 0 0" width="8" height="8" color="#64748b"></a-plane>
    <a-plane position="0 1.6 -3.8" width="8" height="3.2" color="#94a3b8" opacity="0.35"></a-plane>
    <a-plane position="-4 1.6 0" rotation="0 90 0" width="8" height="3.2" color="#475569"></a-plane>
    <a-plane position="4 1.6 0" rotation="0 -90 0" width="8" height="3.2" color="#475569"></a-plane>

    <!-- Rig de Cámara y Mandos Meta Quest 2 -->
    <a-entity id="camera-rig" position="0 0 0">
      <a-camera id="main-camera" position="0 1.6 0" look-controls="pointerLockEnabled: false">
        <a-cursor raycaster="objects: .raycastable" fuse="false" visible="false"></a-cursor>
      </a-camera>

      <!-- Punteros láser para mandos Touch VR -->
      <a-entity laser-controls="hand: right" raycaster="objects: .raycastable; far: 6"></a-entity>
      <a-entity laser-controls="hand: left" raycaster="objects: .raycastable; far: 6"></a-entity>
    </a-entity>

    <!-- Avatar Entrevistador (Ajusta la ruta gltf-model si tu archivo .glb tiene otro nombre/carpeta) -->
    <a-entity
      id="avatar-mesh"
      gltf-model="url(assets/avatar.glb)"
      position="-0.45 0 -2.35"
      rotation="0 12 0"
      scale="1 1 1"
      animation-mixer="clip: *; loop: repeat"
    >
      <a-entity id="target-ojos-avatar" position="0 1.55 0"></a-entity>
    </a-entity>

    <!-- Panel Translúcido de Métricas (Ubicado en el espacio 3D para verse completo en el círculo VR) -->
    <a-entity id="hud-panel" position="0.72 1.56 -2.35" rotation="0 -16 0">
      <a-plane
        width="1.22"
        height="1.44"
        color="#0f2942"
        opacity="0.82"
        material="shader: flat; transparent: true"
      ></a-plane>
      <a-plane
        position="0 0 -0.005"
        width="1.25"
        height="1.47"
        color="#38bdf8"
        opacity="0.45"
        material="shader: flat; transparent: true"
      ></a-plane>

      <a-entity
        id="hud-system"
        position="0 0 0.02"
        text="value: FASE DE HABITUACION TECNICA; color: #ffffff; align: center; width: 1.08; wrapCount: 28"
      ></a-entity>
    </a-entity>

    <!-- Botones 3D Espaciales (Interactivos con rayo láser VR y ratón) -->
    <a-entity
      id="btn-3d-habituacion"
      class="raycastable"
      position="0 0.96 -2.15"
      visible="true"
    >
      <a-plane
        width="1.35"
        height="0.24"
        color="#0284c7"
        opacity="0.9"
        material="shader: flat; transparent: true"
      ></a-plane>
      <a-entity
        position="0 0 0.02"
        text="value: PROBAR MICROFONO E INICIAR; color: #ffffff; align: center; width: 1.3; wrapCount: 28"
      ></a-entity>
    </a-entity>

    <a-entity
      id="btn-3d-finalizar"
      position="-0.38 0.96 -2.15"
      visible="false"
    >
      <a-plane
        width="0.68"
        height="0.22"
        color="#16a34a"
        opacity="0.92"
        material="shader: flat; transparent: true"
      ></a-plane>
      <a-entity
        position="0 0 0.02"
        text="value: TERMINAR RESPUESTA; color: #ffffff; align: center; width: 0.64; wrapCount: 18"
      ></a-entity>
    </a-entity>

    <a-entity
      id="btn-3d-simular"
      position="0.38 0.96 -2.15"
      visible="false"
    >
      <a-plane
        width="0.68"
        height="0.22"
        color="#475569"
        opacity="0.92"
        material="shader: flat; transparent: true"
      ></a-plane>
      <a-entity
        position="0 0 0.02"
        text="value: TEXTO EJEMPLO; color: #ffffff; align: center; width: 0.64; wrapCount: 18"
      ></a-entity>
    </a-entity>
  </a-scene>

  <script type="module">
    import { FSMEngine } from './fsmEngine.js';

    window.addEventListener('DOMContentLoaded', () => {
      const scene = document.querySelector('a-scene');
      const engine = new FSMEngine();

      if (scene.hasLoaded) {
        engine.init();
      } else {
        scene.addEventListener('loaded', () => engine.init());
      }
    });
  </script>
</body>
</html>
